<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern E-Commerce Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script>
        function quickPreview() {
            const width = 800;
            const height = 600;
            const left = (window.screen.width - width) / 2;
            const top = (window.screen.height - height) / 2;
            const popup = window.open(
                window.location.href,
                'StorePreview',
                `width=${width},height=${height},top=${top},left=${left},resizable=yes,scrollbars=yes`
            );
            if (!popup || popup.closed || typeof popup.closed === 'undefined') {
                alert("⚠️ Pop-up Blocked! Please enable pop-ups in your browser settings (look for a blocked icon in your URL bar) to view the Quick Preview.");
            }
        }
    </script>
</head>
<body>
    <header>
        <div class="container header-content">
            <h1>Our Store</h1>
            <div style="display: flex; align-items: center; gap: 15px;">
                <button class="btn btn-secondary" id="preview-btn" onclick="quickPreview()" style="width: auto; display: flex; align-items: center; gap: 6px; padding: 8px 16px;">
                    🔍 Quick Preview
                </button>
                <div class="cart-summary">
                    <span class="cart-icon">🛒</span>
                    <span id="cart-count" class="badge">0 items</span>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Product List Section -->
        <section class="products-section">
            <div class="section-header">
                <h2>Featured Products</h2>
            </div>
            
            <div id="product-container" class="card-container">
                <div class="loader">Loading products...</div>
            </div>
        </section>

        <!-- Cart & Wallet Section -->
        <aside class="cart-section">
            <!-- Wallet Section -->
            <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                <h3 style="margin: 0 0 10px 0; font-size: 14px;">💳 Your Wallet Balance</h3>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <span style="font-size: 24px; font-weight: bold;" id="wallet-balance">$0.00</span>
                    <span style="font-size: 12px; background-color: rgba(255,255,255,0.3); padding: 4px 8px; border-radius: 20px;" id="wallet-status">Updating...</span>
                </div>
                <p style="margin: 0; font-size: 11px; opacity: 0.9;">Balance increases: <strong>$25/1h</strong></p>
                <p style="margin: 5px 0 0 0; font-size: 11px; opacity: 0.9;">Max: $100 | Used at checkout</p>
            </div>

            <h2>Shopping Cart</h2>
            <div id="cart-items-container" class="cart-items">
                <!-- Cart items will be rendered here -->
                <p class="empty-cart-msg">Your cart is empty.</p>
            </div>
            <div class="cart-footer">
                <div class="total-row">
                    <span>Total:</span>
                    <span id="cart-total" class="cart-total-price">$0.00</span>
                </div>
                <button class="btn btn-primary w-100" id="checkout-btn" onclick="openCheckoutForm()">Checkout</button>
                <button class="btn btn-secondary w-100" id="orders-btn" onclick="viewMyOrders()" style="margin-top: 10px;">📦 View My Orders & Reply</button>
            </div>
        </aside>
    </main>

    <!-- Checkout Modal -->
    <div id="checkout-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close-modal" onclick="closeCheckoutForm()">&times;</span>
            <h2>Checkout</h2>
            <form id="checkout-form">
                <div class="form-group">
                    <label for="customer-name">Full Name</label>
                    <input type="text" id="customer-name" name="customer-name" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label for="customer-email">Email</label>
                    <input type="email" id="customer-email" name="customer-email" required placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label for="customer-phone">Phone</label>
                    <input type="tel" id="customer-phone" name="customer-phone" required placeholder="(012)-345-6789">
                </div>
                <div class="form-group">
                    <label for="customer-address">Shipping Address</label>
                    <textarea id="customer-address" name="customer-address" required placeholder="123 Main St, City, Country"></textarea>
                </div>
                <div id="checkout-error" class="error-msg" style="display: none; color: red; margin-bottom: 10px;"></div>
                <div id="checkout-success" class="success-msg" style="display: none; color: green; margin-bottom: 10px;"></div>
                <button type="submit" class="btn btn-primary w-100">Place Order</button>
            </form>
        </div>
    </div>

    <!-- My Orders Modal -->
    <div id="orders-modal" class="modal" style="display: none;">
        <div class="modal-content" style="max-width: 600px; max-height: 80vh; overflow-y: auto;">
            <span class="close-modal" onclick="closeOrdersModal()">&times;</span>
            <h2>My Orders</h2>
            <div id="orders-list" class="orders-list">
                <p>Loading orders...</p>
            </div>
        </div>
    </div>

    <style>
        .modal {
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .close-modal {
            position: absolute;
            right: 15px;
            top: 10px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            color: #999;
        }
        
        .close-modal:hover {
            color: #000;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: inherit;
        }
        
        .orders-list {
            margin-top: 20px;
        }
        
        .order-item {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
            background-color: #f9f9f9;
        }
        
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .order-id {
            font-weight: bold;
            font-size: 14px;
            color: #666;
        }
        
        .order-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .status-pending { background-color: #fff3cd; color: #856404; }
        .status-accepted { background-color: #d1ecf1; color: #0c5460; }
        .status-shipping { background-color: #cce5ff; color: #004085; }
        .status-delivered { background-color: #d4edda; color: #155724; }
        .status-declined { background-color: #f8d7da; color: #721c24; }
        
        .order-details {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }
        
        .order-items {
            background-color: white;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        
        .order-total {
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }
    </style>

    <script src="script.js"></script>
</body>
</html>
