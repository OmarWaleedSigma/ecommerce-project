<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern E-Commerce API Lesson</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script>
        function quickPreview() {
            const width = 800;
            const height = 600;
            const left = (window.screen.width - width) / 2;
            const top = (window.screen.height - height) / 2;
            const popup = window.open(
                window.location.href,
                'AdminPreview',
                `width=${width},height=${height},top=${top},left=${left},resizable=yes,scrollbars=yes`
            );
            if (!popup || popup.closed || typeof popup.closed === 'undefined') {
                alert("⚠️ Pop-up Blocked! Please enable pop-ups in your browser settings (look for a blocked icon in your URL bar) to view the Quick Preview.");
            }
        }
    </script>
</head>
<body>
    <header>
        <div class="container header-content" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
            <div>
                <h1>E-Commerce Admin</h1>
                <p>Manage your products with ease</p>
            </div>
            <button class="btn btn-secondary" id="preview-btn" onclick="quickPreview()" style="width: auto; display: flex; align-items: center; gap: 6px; padding: 8px 16px; font-size: 0.95rem;">
                🔍 Quick Preview
            </button>
        </div>
        <div class="container" style="margin-top: 15px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap;">
            <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 10px 15px; border-radius: 6px; font-size: 14px;">
                <strong>💰 Your Total Revenue:</strong> <span id="admin-revenue">$0.00</span>
            </div>
            <div style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; padding: 10px 15px; border-radius: 6px; font-size: 14px;">
                <strong>📊 From Paid Orders:</strong> <span id="admin-balance-consumed">$0.00</span>
            </div>
        </div>
    </header>
    
    <main class="container">
        <!-- Add Product Section -->
        <section class="add-product-section">
            <h2>Add New Product</h2>
            <form id="add-product-form" class="product-form">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" required placeholder="e.g. Vintage Leather Jacket">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="price">Price ($)</label>
                        <input type="number" id="price" name="price" step="0.01" required placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" name="category" required placeholder="e.g. clothing">
                            <option value="" disabled selected>Select Category</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="image">Image URL</label>
                    <input type="url" id="image" name="image" required placeholder="https://example.com/image.jpg">
                </div>
                
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="3" required placeholder="Product details..."></textarea>
                </div>
                <span id="error"></span>
                <button type="submit" id="add-btn" class="btn btn-primary">Add Product</button>
            </form>
        </section>
                <!-- Orders Management Section -->
                <section class="orders-section" style="margin: 40px 0; padding: 20px; background-color: #f9f9f9; border-radius: 8px;">
                    <div class="section-header">
                        <h2>Order Management</h2>
                        <span id="orders-count" class="badge">0 orders</span>
                    </div>
                    
                    <div id="orders-container" class="orders-container">
                        <!-- Orders will be dynamically rendered here -->
                        <div class="loader">Loading orders...</div>
                    </div>
                </section>
                
        <!-- Product List Section -->
        <section class="product-list-section" style="margin: 40px 0; padding: 20px; background-color: #f9f9f9; border-radius: 8px;">
            <div class="section-header">
                <h2>Product Catalog</h2>
                <span id="product-count" class="badge">0 products</span>
            </div>
            <!-- Product container where products will be rendered. should be a grid layout filling the page width with cards for each product, each card should have the product image, title, price, and category displayed in a clean and modern design. The container should also handle loading states and display a message if no products are available. -->
            <div id="product-container" class="card-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px;">
                <!-- Products will be dynamically rendered here -->
                <div class="loader">Loading products...</div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
